    margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden;
    touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent; font-family:"Press Start 2P", monospace;
    overscroll-behavior:none;
  }
  #safe { position:absolute; top:0; left:0; width:0; height:0; padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right); visibility:hidden; }
  #game {
    position:absolute; image-rendering:pixelated; image-rendering:crisp-edges; background:#000;
    border-radius:6px; box-shadow:0 0 0 3px #2a2440, 0 10px 40px #000a;
  }
  #hint { position:absolute; left:0; right:0; text-align:center; font-size:10px; color:#8a84a8; line-height:1.8; }
  body.touch #hint { display:none; }
  #mute {
    position:absolute; top:calc(8px + env(safe-area-inset-top)); right:calc(8px + env(safe-area-inset-right));
    background:var(--btn); color:var(--ink); border:0; border-radius:8px; font:inherit; font-size:10px;
    padding:8px 10px; cursor:pointer; z-index:5;
  }
  #controls { display:none; }
  body.touch #controls { display:block; }
  #dpad { position:absolute; width:156px; height:156px; touch-action:none; }
  #dpad .arm { position:absolute; background:var(--btn); box-shadow:inset 0 -4px 0 #0005; }
  #dpad .h { left:0; top:52px; width:156px; height:52px; border-radius:10px; }
  #dpad .v { left:52px; top:0; width:52px; height:156px; border-radius:10px; }
  #dpad .tri { position:absolute; width:0; height:0; border:9px solid transparent; opacity:.7; }
  #dpad .tu { left:69px; top:12px; border-bottom:12px solid var(--ink); border-top:0; }
  #dpad .td { left:69px; bottom:12px; border-top:12px solid var(--ink); border-bottom:0; }
  #dpad .tl { top:69px; left:12px; border-right:12px solid var(--ink); border-left:0; }
  #dpad .tr { top:69px; right:12px; border-left:12px solid var(--ink); border-right:0; }
  #dpad .hub { position:absolute; left:62px; top:62px; width:32px; height:32px; border-radius:50%; background:#2c2640; }
  #dpad.dir-up .v, #dpad.dir-down .v, #dpad.dir-left .h, #dpad.dir-right .h { background:var(--btnHi); }
  #ab { position:absolute; width:160px; height:140px; }
  .btn {
    position:absolute; width:68px; height:68px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:16px; color:#fff; box-shadow:inset 0 -5px 0 #0006, 0 3px 8px #0006; touch-action:none;

  #btnB { left:4px; bottom:4px; background:var(--b); }

/* =========================================================
   KRISTEN'S GREAT ESCAPE — an original little castle RPG
   ========================================================= */
const W = 240, H = 160, TS = 16, SCALE = 4;
const cv = document.getElementById('game');
cv.width = W * SCALE; cv.height = H * SCALE;
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
const FONT = '"Press Start 2P", monospace';
const FS = 8, LH = 13;

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ================= SOUND ================= */
const Sound = (() => {
  let ac = null, master, musicGain, sfxGain, muted = store.get('kge_muted', false);
  let track = null, trackName = '', step = 0, nextT = 0, timer = null;
  const mf = n => 440 * Math.pow(2, (n - 69) / 12);
  const TRACKS = {
    title: { bpm: 112, mel: [64,0,67,0,72,0,71,0, 69,0,67,0,64,0,0,0, 65,0,69,0,72,0,74,0, 71,0,0,0,67,0,0,0],
             bass: [48,0,0,0,55,0,0,0, 45,0,0,0,52,0,0,0, 41,0,0,0,48,0,0,0, 43,0,0,0,47,0,0,0] },
    world: { bpm: 132, mel: [72,0,76,0,79,0,76,77, 79,0,77,76,74,0,0,0, 71,0,74,0,77,0,76,74, 72,0,74,76,72,0,0,0],
             bass: [48,0,55,0,48,0,55,0, 53,0,60,0,53,0,60,0, 55,0,62,0,55,0,62,0, 48,0,55,0,48,0,52,0] },
    battle: { bpm: 168, mel: [69,0,69,72,0,69,76,0, 74,72,71,0,72,0,71,67, 69,0,69,72,0,69,77,0, 76,74,72,71,69,0,0,0],
             bass: [45,45,57,45,45,57,45,57, 41,41,53,41,41,53,41,53, 45,45,57,45,45,57,45,57, 40,40,52,40,44,44,56,44] },
    ending: { bpm: 120, mel: [72,76,79,84,0,79,84,0, 81,0,79,0,77,76,77,79, 76,0,72,0,74,0,71,0, 72,0,0,0,0,0,0,0],
             bass: [48,0,55,0,48,0,55,0, 53,0,57,0,53,0,57,0, 55,0,59,0,55,0,59,0, 48,0,55,0,48,0,0,0] },
  };
  function unlock() {
    if (!ac) {
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createGain(); master.gain.value = muted ? 0 : 1; master.connect(ac.destination);
        musicGain = ac.createGain(); musicGain.gain.value = 0.09; musicGain.connect(master);
        sfxGain = ac.createGain(); sfxGain.gain.value = 0.22; sfxGain.connect(master);
        const b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource(); s.buffer = b; s.connect(ac.destination); s.start(0);
      } catch (e) { ac = null; return; }
    }
    if (ac.state === 'suspended') ac.resume();
    if (track && !timer) startSeq();
  }
  function tone(freq, t, dur, type, vol, dest, slideTo) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.03);
  }
  function sfx(name) {
    if (!ac || muted) return;
    const t = ac.currentTime, d = sfxGain;
    switch (name) {
      case 'blip': tone(1046, t, 0.025, 'square', 0.12, d); break;
      case 'move': tone(784, t, 0.04, 'square', 0.25, d); break;
      case 'select': tone(784, t, 0.05, 'square', 0.3, d); tone(1175, t + 0.05, 0.08, 'square', 0.3, d); break;
      case 'bump': tone(110, t, 0.07, 'square', 0.3, d); break;
      case 'door': tone(196, t, 0.12, 'triangle', 0.6, d, 98); break;
      case 'hit': tone(420, t, 0.16, 'sawtooth', 0.5, d, 60); tone(90, t, 0.12, 'square', 0.4, d); break;
      case 'hurt': tone(300, t, 0.2, 'square', 0.45, d, 80); break;
      case 'miss': tone(600, t, 0.1, 'triangle', 0.4, d, 300); break;
      case 'heal': [523, 659, 784, 1046].forEach((f, i) => tone(f, t + i * 0.07, 0.12, 'triangle', 0.5, d)); break;
      case 'item': [659, 784, 988, 1319].forEach((f, i) => tone(f, t + i * 0.06, 0.1, 'square', 0.25, d)); break;
      case 'down': tone(500, t, 0.25, 'square', 0.35, d, 120); break;
      case 'encounter': for (let i = 0; i < 6; i++) tone(1200 - i * 150, t + i * 0.05, 0.05, 'square', 0.3, d); break;
      case 'win': [523, 659, 784, 659, 784, 1046].forEach((f, i) => tone(f, t + i * 0.09, 0.14, 'square', 0.3, d)); break;
      case 'faint': [392, 330, 262, 196].forEach((f, i) => tone(f, t + i * 0.15, 0.2, 'triangle', 0.5, d)); break;
    }
  }
  function startSeq() {
    if (!ac || !track) return;
    nextT = ac.currentTime + 0.05;
    clearInterval(timer);
    timer = setInterval(() => {
      if (!ac || !track) return;
      const stepDur = 60 / track.bpm / 2;
      while (nextT < ac.currentTime + 0.12) {
        const m = track.mel[step % track.mel.length], b = track.bass[step % track.bass.length];
        if (m) tone(mf(m), nextT, stepDur * 0.9, 'square', 0.45, musicGain);
        if (b) tone(mf(b), nextT, stepDur * 0.95, 'triangle', 0.8, musicGain);
        step++; nextT += stepDur;
      }
    }, 25);
  }
  function music(name) {
    if (name === trackName) return;
    trackName = name; track = TRACKS[name] || null; step = 0;
    clearInterval(timer); timer = null;
    if (track && ac) startSeq();
  }
  function setMuted(m) { muted = m; store.set('kge_muted', m); if (master) master.gain.value = m ? 0 : 1; }
  document.addEventListener('visibilitychange', () => { if (!ac) return; if (document.hidden) ac.suspend(); else ac.resume(); });
  return { unlock, sfx, music, setMuted, get muted() { return muted; } };
})();

/* ================= TILES ================= */
const TILES = {};
function disc(g, cx, cy, r, c) { g.fillStyle = c; for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r + r * 0.6) g.fillRect(cx + x, cy + y, 1, 1); }
function makeTiles() {

/* ================= TEXT / UI HELPERS ================= */
function setFont(size = FS) { ctx.font = `${size}px ${FONT}`; }
function wrap(text, maxW, size = FS) {
  setFont(size);
  const out = [];
  for (const para of String(text).split('\n')) {
    let line = '';
    for (const word of para.split(' ')) {
      const test = line ? line + ' ' + word : word;
      if (ctx.measureText(test).width > maxW && line) { out.push(line); line = word; }
      else line = test;
    }
    out.push(line);
  }
  return out;
}
function paginate(text, maxW = 218, lines = 3) {
  const all = wrap(text, maxW); const pages = [];
  for (let i = 0; i < all.length; i += lines) pages.push(all.slice(i, i + lines));
  return pages;
}
function txt(s, x, y, color = '#2a2440', size = FS, align = 'left') {
  setFont(size); ctx.textBaseline = 'top'; ctx.textAlign = align; ctx.fillStyle = color; ctx.fillText(s, x, y); ctx.textAlign = 'left';
}
function shadowTxt(s, x, y, color, size, align, sh = '#000') { txt(s, x + 1, y + 1, sh, size, align); txt(s, x, y, color, size, align); }
function box(x, y, w, h) {

}

  return new Promise(res => { ui.dialog = { pages: [lines], page: 0, shown: 0, res, hold: true }; });
}
function menu(items, style = 'choice', opts = {}) {
  return new Promise(res => { ui.menu = { items, index: opts.index || 0, style, res, cancel: opts.cancel, rects: [] }; });
}
async function ask(prompt, options, cancel) {
  const pages = paginate(prompt);
  for (let i = 0; i < pages.length - 1; i++) await new Promise(res => { ui.dialog = { pages: [pages[i]], page: 0, shown: 0, res, hold: false }; });
  await typeHold(pages[pages.length - 1]);
  const idx = await menu(options, 'choice', { cancel });
  ui.dialog = null;
  return idx;
}
function waitA() { return new Promise(res => { ui.waitA = res; }); }
function until(fn) { return new Promise(res => gs.waiters.push({ fn, res })); }
function fade(target, ms = 250) {
  return new Promise(res => { gs.fadeTarget = target; gs.fadeSpeed = 1000 / Math.max(ms, 1); gs.fadeRes = res; if (gs.fade === target) { gs.fadeRes = null; res(); } });
}
function run(fn) {
  if (gs.busy) return;
  gs.busy = true;
  Promise.resolve().then(fn).catch(e => console.error(e)).finally(() => { gs.busy = false; });
}

async function battle(key, opts = {}) {
  const E = ENEMIES[key];
  const en = { ...E, hp: E.hp, maxHp: E.hp, atk: Math.max(0, E.atk + (opts.atkMod || 0)), talks: 0 };
  Sound.sfx('encounter');
  for (let i = 0; i < 3; i++) { gs.flash = 1; await wait(80); gs.flash = 0; await wait(80); }
  await fade(1, 200);
  gs.mode = 'battle'; Sound.music('battle');
  B = { en, eHp: en.hp, pHp: gs.hp, enter: 0, eBlink: 0, pShake: 0, eDie: 0, bg: gs.map.bg, atkStart: gs.atk };
  await fade(0, 200);
  await until(() => B.enter >= 1);
  await say(E.intro);
  let result = null;
  const moveNames = MOVES.map(m => m.name);
  while (!result) {
    ui.dialog = { pages: [['What will', 'Kristen do?']], page: 0, shown: 999, hold: true, res: null };
    const c = await menu(['FIGHT', 'TALK', 'SNACK', 'FLEE'], 'battle', { index: B.lastMain || 0 });
    B.lastMain = c;
    ui.dialog = null;
    let acted = true;

  shadowTxt('GREAT ESCAPE', W / 2, 26, '#f2d04b', 14, 'center', '#5a2a10');
  shadowTxt('from Castle Grumblewick', W / 2, 46, '#c8c0e8', 6, 'center');
  drawSprite('k_down_0', W / 2 - 16, 116 + Math.round(Math.sin(t * 2)), 2);
  if (Math.floor(t * 2) % 2 === 0) shadowTxt(isTouchDevice ? 'TAP OR PRESS A' : 'PRESS ENTER', W / 2, 100, '#ffffff', 8, 'center');
  shadowTxt(`ENDINGS FOUND: ${foundEndings.length}/8`, W / 2, 150, '#a8a0c8', 6, 'center');
}
function drawEndingArt(id, t) {
  const cxm = W / 2;
  const K = (x, y, s = 3, name = 'k_down_0') => drawSprite(name, x, y, s);
  const crown = (x, y) => { ctx.fillStyle = '#f2d04b'; ctx.fillRect(x, y + 3, 14, 4); ctx.fillRect(x, y, 2, 4); ctx.fillRect(x + 6, y - 1, 2, 5); ctx.fillRect(x + 12, y, 2, 4); ctx.fillStyle = '#d03a3a'; ctx.fillRect(x + 6, y + 4, 2, 2); };
  const bob = Math.round(Math.sin(t * 3) * 2);
  switch (id) {
    case 'sheets': {
      ctx.fillStyle = '#2e2a3d'; ctx.fillRect(130, 30, 90, 80);
      ctx.fillStyle = '#f2d080'; ctx.fillRect(140, 50, 70, 50);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(150, 80, 54, 16); disc(ctx, 158, 80, 5, '#ffffff'); disc(ctx, 170, 78, 6, '#ffffff'); disc(ctx, 190, 79, 5, '#ffffff');
      drawSprite('baron', 168, 58, 2); ctx.fillStyle = '#7cc8e8'; ctx.fillRect(170, 56, 28, 6);
      ctx.fillStyle = '#f2d04b'; ctx.fillRect(194, 74, 6, 5); ctx.fillStyle = '#e8833a'; ctx.fillRect(200, 76, 2, 1);
      ctx.fillStyle = '#e8e8f0'; ctx.fillRect(80, 0, 3, 52);
      K(58 + bob, 44, 3, 'k_up_0'); break;
    }
    case 'chef': {
      drawSprite('soup', 140, 50 + bob, 3);
      K(50, 46, 3);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(60, 30, 28, 18); disc(ctx, 66, 30, 6, '#ffffff'); disc(ctx, 80, 30, 6, '#ffffff'); ctx.fillStyle = '#d8d8e0'; ctx.fillRect(60, 46, 28, 3);
      for (let i = 0; i < 3; i++) { ctx.fillStyle = '#f2d04b'; disc(ctx, 120 + i * 20, 30 + Math.round(Math.sin(t * 4 + i) * 3), 3, '#f2d04b'); }
      break;
    }
    case 'dragon': {
      disc(ctx, 200, 30, 12, '#f4ecd0');
      for (let i = 0; i < 20; i++) { ctx.fillStyle = '#fff'; ctx.fillRect((i * 67) % W, (i * 31) % 70, 1, 1); }
      const dx = 60 + Math.sin(t) * 10;
      drawSprite('smudge', dx, 40 + bob, 5, true);
      drawSprite('k_side_0', dx + 30, 28 + bob, 2);
      break;
    }
    case 'hay': {
      ctx.fillStyle = '#5a983f'; ctx.fillRect(0, 100, W, 30);
      disc(ctx, 120, 108, 30, '#e8c84a'); for (let i = 0; i < 12; i++) { ctx.fillStyle = '#c9a13b'; ctx.fillRect(96 + i * 4, 82 + (i % 3) * 4, 1, 6); }
      K(96, 50 + bob, 3);
      ctx.fillStyle = '#e8c84a'; ctx.fillRect(100, 52, 4, 2); ctx.fillRect(130, 56, 5, 1); ctx.fillRect(110, 86, 6, 1);
      disc(ctx, 172, 70, 8, '#3f7fb8'); disc(ctx, 172, 70, 4, '#f2d04b'); ctx.fillStyle = '#3f7fb8'; ctx.fillRect(168, 76, 3, 12); ctx.fillRect(174, 76, 3, 12);
      break;
    }
    case 'taxes': {
      K(40, 46, 3); drawSprite('baron', 150, 46, 3);
      for (let i = 0; i < 18; i++) { const x = 100 + (i % 6) * 7, y = 100 - Math.floor(i / 6) * 5; disc(ctx, x, y, 3, '#f2d04b'); ctx.fillStyle = '#c9a13b'; ctx.fillRect(x - 1, y, 2, 1); }
      const sp = Math.floor(t * 3) % 3; ctx.fillStyle = '#ffffff'; ctx.fillRect(108 + sp * 10, 70, 1, 3); ctx.fillRect(107 + sp * 10, 71, 3, 1);
      break;
    }
    case 'queen': {
      ctx.fillStyle = '#c9a13b'; ctx.fillRect(cxm - 32, 30, 64, 70); ctx.fillStyle = '#a01e2e'; ctx.fillRect(cxm - 26, 36, 52, 60);
      drawSprite('k_down_0', cxm - 24, 46, 3);
      crown(cxm - 7, 42 + bob);
      drawSprite('ghost', 30, 60 + bob, 2); drawSprite('gobbo', 180, 64, 2);
      break;
    }
    case 'home': {
      ctx.fillStyle = '#8a5a32'; ctx.fillRect(130, 50, 80, 50); ctx.fillStyle = '#a8303f'; ctx.beginPath(); ctx.moveTo(124, 52); ctx.lineTo(170, 22); ctx.lineTo(216, 52); ctx.fill();
      ctx.fillStyle = '#f2d080'; ctx.fillRect(142, 62, 14, 12); ctx.fillRect(184, 62, 14, 12); ctx.fillStyle = '#4f311a'; ctx.fillRect(163, 74, 14, 26);
      K(50, 50, 3);
      ctx.fillStyle = '#f8f6ee'; ctx.fillRect(104, 40 + bob, 18, 12); ctx.fillStyle = '#d03a3a'; ctx.fillRect(111, 44 + bob, 4, 4);
      break;
    }
    case 'intern': {
      for (let i = 0; i < 16; i++) { ctx.fillStyle = i % 2 ? '#f8f6ee' : '#e0dccc'; ctx.fillRect(140 + (i % 3), 100 - i * 5, 40, 5); }
      K(60, 50, 3);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(108, 78, 10, 12); ctx.fillRect(118, 81, 3, 6); ctx.fillStyle = '#d03a3a'; ctx.fillRect(110, 82, 6, 3);
      break;
    }
  }
}
function drawEnding() {
  const E = ENDINGS[gs.endingId]; const t = gs.endT;
  ctx.fillStyle = E.bg; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,0.05)'; for (let i = 0; i < 12; i++) ctx.fillRect((i * 40 + t * 10) % (W + 40) - 20, 0, 12, H);
  drawEndingArt(gs.endingId, t);
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, 22);
  shadowTxt(`ENDING ${E.n} OF 8${gs.endingNew ? '  - NEW!' : ''}`, W / 2, 2, '#f2a0c3', 6, 'center');
  shadowTxt(E.title, W / 2, 11, '#f2d04b', 8, 'center');
  if (gs.endingDone) {
    box(4, 108, 232, 48);
    txt('THE END', W / 2, 114, '#c4495e', 8, 'center');
    txt(`Endings found: ${foundEndings.length}/8`, W / 2, 128, '#2a2440', 7, 'center');
    if (Math.floor(gs.time * 2) % 2 === 0) txt(foundEndings.length >= 8 ? 'You found them all! Press A' : 'Press A to try another path', W / 2, 142, '#5a5474', 6, 'center');
  }
}
function drawDialog() {
  const d = ui.dialog; if (!d) return;
  const inBattleMain = gs.mode === 'battle' && ui.menu && ui.menu.style === 'battle';
  box(4, 108, 232, 48);
  let left = Math.floor(d.shown);
  const lines = d.pages[d.page];
  lines.forEach((ln, i) => {
    const s = ln.slice(0, Math.max(0, left)); left -= ln.length;
    txt(s, 12, 115 + i * LH, '#2a2440');
  });
  const full = lines.join('').length;
  if (!d.hold && d.shown >= full && !inBattleMain) {
    const y = 147 + (Math.floor(gs.time * 3) % 2);
    ctx.fillStyle = '#c4495e'; ctx.fillRect(222, y, 7, 2); ctx.fillRect(223, y + 2, 5, 1); ctx.fillRect(224, y + 3, 3, 1); ctx.fillRect(225, y + 4, 1, 1);
  }
}
function drawMenu() {
  const m = ui.menu; if (!m) return;
  m.rects = [];
  if (m.style === 'choice') {
    setFont(FS);
    const w = Math.max(...m.items.map(s => ctx.measureText(s).width)) + 26;
    const h = m.items.length * LH + 10;
    const x = 236 - w, y = 106 - h;
    box(x, y, w, h);
    m.items.forEach((s, i) => {
      const iy = y + 6 + i * LH;
      txt(s, x + 16, iy, '#2a2440');
      if (i === m.index) cursorTri(x + 7, iy);
      m.rects.push({ x, y: iy - 3, w, h: LH });
    });
  } else if (m.style === 'battle') {
    box(124, 108, 112, 48);
    m.items.forEach((s, i) => {
      const ix = 138 + (i % 2) * 50, iy = 118 + Math.floor(i / 2) * 18;
      txt(s, ix, iy, '#2a2440');
      if (i === m.index) cursorTri(ix - 9, iy);
      m.rects.push({ x: ix - 12, y: iy - 5, w: 50, h: 18 });
    });
  } else if (m.style === 'moves') {
    box(4, 108, 232, 48);
    m.items.forEach((s, i) => {
      const ix = 20 + (i % 2) * 110, iy = 118 + Math.floor(i / 2) * 18;
      txt(s, ix, iy, '#2a2440');
      if (i === m.index) cursorTri(ix - 10, iy);
      m.rects.push({ x: ix - 14, y: iy - 5, w: 110, h: 18 });
    });
    txt('B: back', 230, 150, '#8a84a8', 5, 'right');
  }
}
function draw() {
  ctx.save();
  if (gs.mode === 'title') drawTitle();
  else if (gs.mode === 'world') drawWorld();
  else if (gs.mode === 'battle' && B) drawBattle();
  else if (gs.mode === 'ending') drawEnding();
  else { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }
  if (gs.mode === 'battle' && gs.shake > 0) { ctx.fillStyle = 'rgba(255,0,0,0.12)'; ctx.fillRect(0, 0, W, H); }
  drawDialog();
  drawMenu();
  if (gs.flash) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); }
  if (gs.fade > 0) { ctx.fillStyle = `rgba(0,0,0,${gs.fade})`; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
}

/* ================= INPUT WIRING ================= */
const input = { held: {}, pressed: {}, tap: null };
function press(k) { if (!input.held[k]) input.pressed[k] = true; input.held[k] = true; }
function release(k) { input.held[k] = false; }
const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', KeyZ: 'a', Enter: 'a', Space: 'a', KeyX: 'b', Escape: 'b', Backspace: 'b' };
addEventListener('keydown', e => { const k = KEYMAP[e.code]; if (!k) return; e.preventDefault(); Sound.unlock(); if (!e.repeat) press(k); });
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) release(k); });
addEventListener('blur', () => { input.held = {}; });
['touchend', 'click', 'pointerdown'].forEach(ev => addEventListener(ev, () => Sound.unlock(), { passive: true }));
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  input.tap = { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
});
const dpad = document.getElementById('dpad');
let dpadPointer = null;
function setDir(d) {
  for (const k of ['up', 'down', 'left', 'right']) { if (k === d) press(k); else release(k); }
  dpad.className = d ? 'dir-' + d : '';
}
function dpadFromEvent(e) {
  const r = dpad.getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  if (Math.hypot(dx, dy) < 10) return setDir(null);
  setDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
}
dpad.addEventListener('pointerdown', e => { e.preventDefault(); dpadPointer = e.pointerId; try { dpad.setPointerCapture(e.pointerId); } catch (_) {} dpadFromEvent(e); });
dpad.addEventListener('pointermove', e => { if (e.pointerId === dpadPointer) dpadFromEvent(e); });
const dpadEnd = e => { if (e.pointerId === dpadPointer) { dpadPointer = null; setDir(null); } };
dpad.addEventListener('pointerup', dpadEnd); dpad.addEventListener('pointercancel', dpadEnd); dpad.addEventListener('lostpointercapture', dpadEnd);
for (const [id, k] of [['btnA', 'a'], ['btnB', 'b']]) {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.classList.add('down'); press(k); if (navigator.vibrate) navigator.vibrate(8); });
  const up = () => { el.classList.remove('down'); release(k); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('pointerleave', up);
}
const muteBtn = document.getElementById('mute');
function refreshMute() { muteBtn.textContent = Sound.muted ? '♪ OFF' : '♪ ON'; }
muteBtn.addEventListener('pointerdown', e => { e.stopPropagation(); });
muteBtn.addEventListener('click', e => { e.preventDefault(); Sound.unlock(); Sound.setMuted(!Sound.muted); refreshMute(); muteBtn.blur(); });
refreshMute();

/* ================= LAYOUT ================= */
const isTouchDevice = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window;
if (isTouchDevice) document.body.classList.add('touch');
function safeInsets() { const s = getComputedStyle(document.getElementById('safe')); return { t: parseFloat(s.paddingTop) || 0, b: parseFloat(s.paddingBottom) || 0, l: parseFloat(s.paddingLeft) || 0, r: parseFloat(s.paddingRight) || 0 }; }
function layout() {
  const vw = innerWidth, vh = innerHeight, si = safeInsets();
  const portrait = vh >= vw;
  const dp = document.getElementById('dpad').style, ab = document.getElementById('ab').style, hint = document.getElementById('hint').style;
  let w, h, left, top;
  if (isTouchDevice && portrait) {
    const ctrlH = 200 + si.b;
    w = Math.min(vw - 12, (vh - si.t - ctrlH - 20) * 1.5); h = w / 1.5;
    left = (vw - w) / 2; top = si.t + Math.max(36, (vh - si.t - ctrlH - h) / 2);
    const cy = Math.min(vh - si.b - 170, top + h + 24);
    dp.left = (12 + si.l) + 'px'; dp.top = cy + 'px';
    ab.right = (12 + si.r) + 'px'; ab.left = 'auto'; ab.top = (cy + 8) + 'px';
  } else if (isTouchDevice) {
    w = Math.min(vw - si.l - si.r - 2 * 172, (vh - 16) * 1.5); h = w / 1.5;
    if (h > vh - 16) { h = vh - 16; w = h * 1.5; }
    left = (vw - w) / 2; top = (vh - h) / 2;
    dp.left = (10 + si.l) + 'px'; dp.top = (vh - 156 - 20 - si.b) + 'px';
    ab.right = (10 + si.r) + 'px'; ab.left = 'auto'; ab.top = (vh - 140 - 24 - si.b) + 'px';
  } else {
    w = Math.min(vw - 32, (vh - 70) * 1.5); h = w / 1.5;
    left = (vw - w) / 2; top = Math.max(12, (vh - h - 30) / 2);
    hint.top = (top + h + 12) + 'px';
  }
  Object.assign(cv.style, { width: w + 'px', height: h + 'px', left: left + 'px', top: top + 'px' });
}
addEventListener('resize', layout);
addEventListener('orientationchange', () => setTimeout(layout, 200));
layout();

/* ================= MAIN LOOP ================= */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
function start() {
  gs.mode = 'title'; gs.fade = 1; fade(0, 600); Sound.music('title');
  requestAnimationFrame(frame);
}
const fontReady = (document.fonts && document.fonts.load) ? Promise.race([document.fonts.load(`8px ${FONT}`), wait(2500)]) : Promise.resolve();
fontReady.then(start, start);
</script>
